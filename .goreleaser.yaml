version: 2

builds:
  - main: ./cmd/unione-mcp
    binary: unione-mcp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

# Bare binaries named <server>-<os>-<arch>[.exe]: the npm package downloads them
# by that name and checks them against checksums.txt.
archives:
  - formats: [binary]
    name_template: "{{ .Binary }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
